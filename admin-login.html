<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebook Admin Login</title>
    <link rel="stylesheet" href="css/admin-login-style.css">
</head>
<body>
    <main class="admin-login">
        <section class="admin-login__content" aria-labelledby="admin-title">
            <img class="logo-icon" src="assets/images/ReBook-Logo-nobg.png" alt="ReBook logo">
            <h1 id="admin-title"><span>ReBook</span> Admin Portal</h1>

            <form class="login-form">
                <input type="email" name="email" placeholder="Email" aria-label="Email" required>
                <input type="password" name="password" placeholder="Password" aria-label="Password" required>
                <button type="submit">Login</button>
            </form>
            <a class="forgot-password" href="forgot-password.html">Forgot password?</a>
        </section>
    </main>

    <footer class="admin-footer">
        © 2026 ReBook. All rights reserved<br>
        Web Development Project
    </footer>
</body>
</html>
