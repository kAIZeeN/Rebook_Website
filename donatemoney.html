<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebook Donate Money</title>
    <link rel="stylesheet" href="css/donatemoney-style.css">
</head>
<body>
    <header class="navbar">
    <a href="Homepage.html" class="brand">
      <img class="brand-icon" src="assets/images/ReBook-Logo-nobg.png" alt="ReBook logo">
      ReBook
    </a>

    <input class="mobile-nav-toggle-input" type="checkbox" id="mobile-nav-donatemoney" aria-label="Toggle navigation">
    <label class="mobile-nav-toggle" for="mobile-nav-donatemoney" aria-label="Open navigation menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </label>

    <ul class="nav-links">
      <li><a href="Homepage.html">Home</a></li>
      <li class="dropdown"><a href="about.html">About Us</a><span class="caret">▾</span>
        <ul class="submenu"><li><a href="how-it-works.html">How it works</a></li></ul>
      </li>
      <li><a href="books.html">Books</a></li>
      <li><a href="contact.html">Contact Us</a></li>
      <li><a href="donate.html"><button class="donate-btn">Donate</button></a></li>
    </ul>

    <div class="navbar-right">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" placeholder="Search for a book">
      </div>
      <a href="login_and_signup_page.html" class="profile-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="8" r="4" stroke="white" stroke-width="2"/>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </a>
    </div>
  </header>

    <main class="donation-wrapper donation-payment-wrapper">
        <section class="payment-options">
            <div class="payment-selection">
                <button class="payment-button" type="button">Give Once</button>
                <button class="payment-button" type="button">Monthly</button>
            </div>
            <div class="donation-amount">
                <button class="price-button" type="button">₱100</button>
                <button class="price-button" type="button">₱200</button>
                <button class="price-button" type="button">₱300</button>
                <button class="price-button" type="button">₱400</button>
                <button class="price-button" type="button">₱500</button>
                <button class="price-button" type="button">₱1,000</button>
                <label class="custom-amount" for="custom-amount">
                    <span aria-hidden="true">₱</span>
                    <input type="number" id="custom-amount" placeholder="Enter your desired amount" min="1">
                    <span>PHP</span>
                </label>
            </div>
        </section>
        <section class="donate-money-details">
            <h2 class="donate-money-form-title">Enter Your Details</h2>
            <form class="donate-money-form">
                <input type="text" id="first-name" placeholder="First Name" required>
                <input type="text" id="last-name" placeholder="Last Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="tel" id="phone" placeholder="Phone Number" pattern="[0-9]{11}" required>
                <div class="payment-method-row">
                    <img class="payment-method-image" src="assets/images/gcash-logo.png" alt="GCash">
                    <select name="payment-method" id="payment-method" required>
                        <option value="" disabled selected>Select Payment Method</option>
                        <option value="gcash">GCash</option>
                        <option value="paymaya">PayMaya</option>
                        <option value="bank-transfer">Bank Transfer</option>
                    </select>
                </div>
                <div class="terms-row">
                    <input type="checkbox" id="terms" required>
                    <label for="terms" class="text-term"> I agree to the collection and use of my personal information as stated in the Privacy Notice.</label>
                </div>
                <button class="submit-button">Submit</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
    <div class="footer-left">
      Write a new chapter.<br>
      Support our mission.
    </div>
    <div class="footer-right">
      © 2026 ReBook. All rights reserved<br>
      Web Development Project
    </div>
  </footer>

</body>
</html>
