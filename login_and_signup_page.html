<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReBook - Welcome</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/login_and_signup_style.css">
</head>

<body>

    <div class="page">

        <!-- ================= HEADER ================= -->

        <header class="navbar">

            <a href="homepage.html" class="brand">
                <img
                    class="brand-icon"
                    src="asset/ReBook-Logo-nobg.png"
                    alt="ReBook logo"
                >
                ReBook
            </a>

            <ul class="nav-links">

                <li>
                    <a href="homepage.html">Home</a>
                </li>

                <li class="dropdown">
                    <a href="#">About Us</a>
                    <span class="caret">▾</span>
                </li>

                <li>
                    <a href="#">Books</a>
                </li>

                <li>
                    <a href="contact.html">Contact Us</a>
                </li>

                <li>
                    <button class="donate-btn">
                        Donate
                    </button>
                </li>

            </ul>


            <!-- Navbar Right -->

            <div class="navbar-right">

                <div class="search-box">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                            stroke="currentColor"
                            stroke-width="2"
                        />

                        <line
                            x1="21"
                            y1="21"
                            x2="16.65"
                            y2="16.65"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                    </svg>

                    <input
                        type="text"
                        placeholder="Search for a book"
                    >

                </div>


                <a href="login_and_signup_page.html" class="profile-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <circle
                            cx="12"
                            cy="8"
                            r="4"
                            stroke="white"
                            stroke-width="2"
                        />

                        <path
                            d="M4 20c0-4 4-6 8-6s8 2 8 6"
                            stroke="white"
                            stroke-width="2"
                            stroke-linecap="round"
                        />

                    </svg>

                </a>

            </div>

        </header>


        <!-- ================= MAIN CONTENT ================= -->

        <main class="welcome-section">

            <div class="welcome-content">

                <!-- ReBook Logo -->

                <img
                    class="welcome-logo"
                    src="asset/ReBook-Logo.png"
                    alt="ReBook logo"
                >


                <!-- Welcome Title -->

                <h1>
                    Welcome to <span>ReBook</span>
                </h1>


                <!-- Buttons -->

                <div class="auth-buttons">

                    <a
                        href="login.html"
                        class="login-btn"
                    >
                        Login
                    </a>

                    <a
                        href="signup.html"
                        class="signup-btn"
                    >
                        Register
                    </a>

                </div>

            </div>

        </main>


        <!-- ================= FOOTER ================= -->

        <footer class="site-footer">

            <div class="footer-left">
                Write a new chapter.<br>
                Support our mission.
            </div>

            <div class="footer-right">
                © 2026 ReBook. All rights reserved<br>
                Web Development Project
            </div>

        </footer>

    </div>

</body>

</html>
