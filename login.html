<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReBook - Welcome</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/login-style.css">
</head>

<body>

    <div class="page">

        <!-- ================= HEADER ================= -->

        <header class="navbar">

            <a href="Homepage.html" class="brand">
                <img class="brand-icon" src="assets/images/ReBook-Logo-nobg.png" alt="ReBook logo">
                ReBook
            </a>

            <input class="mobile-nav-toggle-input" type="checkbox" id="mobile-nav-welcome"
                aria-label="Toggle navigation">
            <label class="mobile-nav-toggle" for="mobile-nav-welcome" aria-label="Open navigation menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                    aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </label>

            <ul class="nav-links">

                <li>
                    <a href="Homepage.html">Home</a>
                </li>

                <li class="dropdown">
                    <a href="about.html">About Us</a>
                    <span class="caret">▾</span>
                    <ul class="submenu">
                        <li><a href="how-it-works.html">How it works</a></li>
                    </ul>
                </li>

                <li>
                    <a href="books.html">Books</a>
                </li>

                <li>
                    <a href="contact.html">Contact Us</a>
                </li>

                <li>
                    <button class="donate-btn">
                        Donate
                    </button>
                </li>

            </ul>


            <!-- Navbar Right -->

            <div class="navbar-right">

                <div class="search-box">

                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />

                        <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>

                    <input type="text" placeholder="Search for a book">

                </div>


                <a href="login_and_signup_page.html" class="profile-icon">

                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                        <circle cx="12" cy="8" r="4" stroke="white" stroke-width="2" />

                        <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="white" stroke-width="2" stroke-linecap="round" />

                    </svg>

                </a>

            </div>

        </header>


        <!-- ================= MAIN CONTENT ================= -->

        <main class="welcome-section">

            <div class="welcome-content">

                <img
                    class="welcome-logo"
                    src="assets/images/ReBook-Logo-nobg.png"
                    alt="ReBook logo"
                >

                <h1>
                    Welcome to <span>ReBook</span>
                </h1>

                <div class="login_form">

                    <form>

                        <div class="input-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" placeholder="Username">
                        </div>

                        <div class="input-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" placeholder="Password">
                        </div>

                        <button type="submit">
                            Login
                        </button>

                        <p class="signup-link">
                            Don't have an account?
                            <a href="signup.html">Register</a>
                        </p>

                    </form>

                </div>

            </div>

        </main>

        <!-- ================= FOOTER ================= -->

        <footer class="site-footer">

            <div class="footer-left">
                Write a new chapter.<br>
                Support our mission.
            </div>

            <div class="footer-right">
                © 2026 ReBook. All rights reserved<br>
                Web Development Project
            </div>

        </footer>

    </div>

</body>

</html>
