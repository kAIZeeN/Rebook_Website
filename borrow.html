  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/borrow.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/rebook-navbar.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- header -->
  <nav class="navbar navbar-expand-lg navbar-dark rebook-navbar">
    <a href="Homepage.html" class="brand navbar-brand">
      <img class="brand-icon" src="assets/images/ReBook-Logo-nobg.png" alt="ReBook logo">
      ReBook
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#rebookNavbar" aria-controls="rebookNavbar"
      aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="rebookNavbar">
      <ul class="nav-links navbar-nav">
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="Homepage.html">Home</a></li>
        <li class="nav-item dropdown rebook-about-dropdown">
          <a class="nav-link" href="about.html">About Us</a>
          <button class="nav-link dropdown-toggle dropdown-toggle-split" type="button"
            data-bs-toggle="dropdown" aria-expanded="false" aria-label="More About Us pages"></button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="how-it-works.html">How it works</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link" href="books.html">Books</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
        <li class="nav-item"><a class="nav-link donate-link" href="donate.html">Donate</a></li>
      </ul>

      <div class="navbar-right">
        <label class="search-box" aria-label="Search for a book">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" placeholder="Search for a book" aria-label="Search for a book">
        </label>
        <button id="darkmodebtn" class="darkbtn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
          <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        </button>
        <a href="login_and_signup_page.html" class="profile-icon" aria-label="Log in or sign up">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </a>
      </div>
    </div>
  </nav>

  <main id="main" class="container">
    <div class="borrow-card">
      <div>
        <div class="borrow-card__cover">
          <!-- put your image here: assets/images/books/sons-of-the-sword.jpg -->
        <div class="img-slot " style="--ratio:2 / 3" role="img" aria-label="Cover of Sons of the Sword (Featured Story)" data-label="BOOK COVER&#10;assets/images/books/sons-of-the-sword.png" data-book-field="cover"><span class="img-slot__img" style="background-image:url('assets/images/books/sons-of-the-sword.png')"></span></div>
        </div>
        <p class="borrow-card__book" data-book-field="title">Sons of the Sword (Featured Story)</p>
      </div>

      <section aria-labelledby="borrow-title">
        <h1 id="borrow-title">Borrow Details</h1>

        <!-- the browser checks the required fields, then opens the confirmation page -->
        <form action="borrow-confirmation.html" method="get">
            <input type="hidden" name="book" value="book-1" data-book-field="book-id">
            <div class="field">
              <label for="fullName">Full Name</label>
              <input id="fullName" name="fullName" type="text" required minlength="3" autocomplete="name">
            </div>
            <div class="field">
              <label for="city">City/Municipality</label>
              <input id="city" name="city" type="text" required autocomplete="address-level2">
            </div>
            <div class="field">
              <label for="barangay">Barangay</label>
              <input id="barangay" name="barangay" type="text" required >
            </div>
            <div class="field">
              <label for="postalCode">Postal Code</label>
              <input id="postalCode" name="postalCode" type="text" required inputmode="numeric" maxlength="4" pattern="[0-9]{4}" title="Enter a 4-digit postal code, e.g. 1000" autocomplete="postal-code">
            </div>
            <div class="field">
              <label for="address">Home Address</label>
              <input id="address" name="address" type="text" required minlength="5" autocomplete="street-address">
            </div>
            <div class="field">
              <label for="schedule">Borrow Schedule</label>
              <input id="schedule" name="schedule" type="date" required>
            </div>

            <div class="field field--check">
              <input id="consent" name="consent" type="checkbox" required>
              <label for="consent" style="font-weight:400">I agree to the collection and use of my personal information as stated in the <a href="privacy.html">Privacy Notice</a>.</label>
            </div>

            <div class="form-actions"><button class="btn" type="submit">Submit</button></div>
          </form>
        </section>
    </div>
  </main>
  <!-- footer -->
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>Write a new chapter.<br>Support our mission.</p>
      <p class="site-footer__right">&copy; 2026 ReBook. All rights reserved<br>Web Development Project</p>
    </div>
  </footer>
<script src="javascript/darkbtn.js"></script>
<script src="javascript/borrow-request.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
